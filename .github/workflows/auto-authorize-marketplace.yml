name: Auto-authorize marketplace

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-authorize-marketplace.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: buyqk-rider

      - name: Update rules and rule tests for automatic authorization
        shell: python
        run: |
          from pathlib import Path

          rules_path = Path('firestore.rules')
          rules = rules_path.read_text()

          old_public = '''    function publicStore(storeId) {
      return exists(/databases/$(database)/documents/stores/$(storeId))
        && get(/databases/$(database)/documents/stores/$(storeId)).data.isApproved == true
        && get(/databases/$(database)/documents/stores/$(storeId)).data.status == 'active'
        && get(/databases/$(database)/documents/stores/$(storeId)).data.isOpen == true;
    }'''
          new_public = '''    function publicStoreData(data) {
      return data.isApproved == true
        && data.status == 'active'
        && data.isOpen == true;
    }

    function publicStore(storeId) {
      return exists(/databases/$(database)/documents/stores/$(storeId))
        && publicStoreData(
          get(/databases/$(database)/documents/stores/$(storeId)).data
        );
    }'''

          replacements = [
            (old_public, new_public),
            ("        && request.resource.data.accountStatus == 'pending'", "        && request.resource.data.accountStatus == 'active'"),
            ("        ).data.status == 'pending_approval';", "        ).data.status == 'active'\n        && getAfter(\n          /databases/$(database)/documents/stores/$(request.resource.data.storeId)\n        ).data.isApproved == true;"),
            ("        && request.resource.data.isApproved == false\n        && request.resource.data.status == 'pending_approval'", "        && request.resource.data.isApproved == true\n        && request.resource.data.status == 'active'"),
            ("        || publicStore(storeId);", "        || publicStoreData(resource.data);"),
          ]

          for old, new in replacements:
            if old not in rules:
              raise SystemExit(f'Missing expected rules snippet: {old!r}')
            rules = rules.replace(old, new, 1)

          rules_path.write_text(rules)

          tests_path = Path('tests/firestore-rules.integration.mjs')
          tests = tests_path.read_text()
          tests = tests.replace(
            "  collection,\n  doc,\n  runTransaction,",
            "  collection,\n  doc,\n  getDocs,\n  query,\n  runTransaction,"
          )
          tests = tests.replace(
            "  updateDoc,\n  writeBatch",
            "  updateDoc,\n  where,\n  writeBatch"
          )
          tests = tests.replace(
            "test('merchant onboarding requires the pending store and profile to be created together'",
            "test('merchant onboarding creates an active store and profile together'"
          )
          tests = tests.replace(
            "    isApproved: false,\n    status: 'pending_approval',",
            "    isApproved: true,\n    status: 'active',",
            1
          )
          tests = tests.replace(
            "    accountStatus: 'pending'",
            "    accountStatus: 'active'",
            1
          )

          anchor = "test('customer order validation accepts the real bill and rejects a tampered total', async () => {"
          public_test = '''test('public homepage query can list active open stores', async () => {
  const publicDb = rulesEnvironment.unauthenticatedContext().firestore();
  const storesQuery = query(
    collection(publicDb, 'stores'),
    where('isApproved', '==', true),
    where('status', '==', 'active'),
    where('isOpen', '==', true)
  );
  const snapshot = await assertSucceeds(getDocs(storesQuery));
  assert.equal(snapshot.size, 1);
});

'''
          if public_test not in tests:
            if anchor not in tests:
              raise SystemExit('Could not locate test insertion point.')
            tests = tests.replace(anchor, public_test + anchor, 1)

          tests_path.write_text(tests)

      - name: Install dependencies and validate
        run: |
          npm ci
          npm test
          npm run build
          npx --yes firebase-tools@15.25.1 emulators:exec --only firestore --project demo-buyqk-rules-tests "npm run test:rules"

      - name: Deploy Firestore rules
        shell: bash
        run: |
          set -e
          if npx --yes firebase-tools@15.25.1 deploy --only firestore:rules --project buyqk-rider --non-interactive; then
            exit 0
          fi

          echo "Firebase CLI deployment failed; using Firebase Rules REST API fallback."
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          project = 'buyqk-rider'
          token = os.environ['ACCESS_TOKEN']

          def request(url, method='GET', body=None):
              headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          ruleset = request(
              f'https://firebaserules.googleapis.com/v1/projects/{project}/rulesets',
              'POST',
              {'source': {'files': [{'name': 'firestore.rules', 'content': Path('firestore.rules').read_text()}]}}
          )
          release_url = f'https://firebaserules.googleapis.com/v1/projects/{project}/releases/cloud.firestore?updateMask=ruleset_name'
          request(
              release_url,
              'PATCH',
              {
                  'name': f'projects/{project}/releases/cloud.firestore',
                  'rulesetName': ruleset['name']
              }
          )
          print('Firestore rules deployed through REST API.')
          PY

      - name: Activate existing stores, merchants, and riders
        shell: bash
        run: |
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python <<'PY'
          import datetime
          import json
          import os
          import urllib.parse
          import urllib.request

          project = 'buyqk-rider'
          database = '(default)'
          token = os.environ['ACCESS_TOKEN']
          root = f'https://firestore.googleapis.com/v1/projects/{project}/databases/{database}/documents'

          def api(url, method='GET', body=None):
              headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def documents(collection):
              page_token = ''
              while True:
                  query = {'pageSize': 300}
                  if page_token:
                      query['pageToken'] = page_token
                  result = api(f"{root}/{collection}?{urllib.parse.urlencode(query)}")
                  yield from result.get('documents', [])
                  page_token = result.get('nextPageToken', '')
                  if not page_token:
                      break

          def value(field):
              if not field:
                  return None
              return next(iter(field.values()), None)

          def patch(document, fields):
              masks = [('updateMask.fieldPaths', name) for name in fields]
              url = f"https://firestore.googleapis.com/v1/{document['name']}?{urllib.parse.urlencode(masks)}"
              api(url, 'PATCH', {'fields': fields})

          now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z')
          counts = {'stores': 0, 'merchants': 0, 'riders': 0}

          for document in documents('stores'):
              fields = document.get('fields', {})
              if value(fields.get('isApproved')) is not True or value(fields.get('status')) != 'active':
                  patch(document, {
                      'isApproved': {'booleanValue': True},
                      'status': {'stringValue': 'active'},
                      'updatedAt': {'timestampValue': now},
                  })
                  counts['stores'] += 1

          for document in documents('merchants'):
              fields = document.get('fields', {})
              if value(fields.get('accountStatus')) != 'active':
                  patch(document, {
                      'accountStatus': {'stringValue': 'active'},
                      'updatedAt': {'timestampValue': now},
                  })
                  counts['merchants'] += 1

          for document in documents('riders'):
              fields = document.get('fields', {})
              if value(fields.get('isApproved')) is not True or value(fields.get('accountStatus')) != 'active':
                  patch(document, {
                      'isApproved': {'booleanValue': True},
                      'accountStatus': {'stringValue': 'active'},
                      'updatedAt': {'timestampValue': now},
                  })
                  counts['riders'] += 1

          print('Activated records:', counts)
          PY

      - name: Commit marketplace authorization changes
        run: |
          rm -f .github/workflows/auto-authorize-marketplace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules tests/firestore-rules.integration.mjs .github/workflows/auto-authorize-marketplace.yml
          git commit -m "Auto-authorize merchants and riders"
          git push
