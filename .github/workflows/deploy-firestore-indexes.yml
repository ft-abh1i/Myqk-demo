name: Deploy Firestore Indexes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "firestore.indexes.json"
      - "firebase.json"
      - ".github/workflows/deploy-firestore-indexes.yml"

permissions:
  contents: write

concurrency:
  group: deploy-firestore-indexes
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy indexes to buyqk-rider
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore indexes
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          firebase deploy --only firestore:indexes --project buyqk-rider --non-interactive 2>&1 | tee firebase-deploy.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Record deployment result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          EXIT_CODE: ${{ steps.deploy.outputs.exit_code }}
        shell: bash
        run: |
          {
            printf 'outcome=%s\nsource_sha=%s\nexit_code=%s\n\n' "$DEPLOY_OUTCOME" "$SOURCE_SHA" "$EXIT_CODE"
            if [ -f firebase-deploy.log ]; then
              tail -n 35 firebase-deploy.log \
                | sed -E 's/(Help Token:).*/\1 [redacted]/' \
                | sed -E 's#https://[^ ]+#https://[redacted]#g'
            fi
          } > firestore-index-deploy-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore-index-deploy-status.txt
          git commit -m "Record Firestore index deployment result" || exit 0
          git push

      - name: Fail workflow when deployment fails
        if: steps.deploy.outcome != 'success'
        run: exit 1
