name: Deploy Firestore Indexes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "firestore.indexes.json"
      - "firebase.json"
      - ".github/workflows/deploy-firestore-indexes.yml"

permissions:
  contents: write

concurrency:
  group: deploy-firestore-indexes
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy indexes to buyqk-rider
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: buyqk-rider

      - name: Create Firestore composite indexes
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            set -e

            create_index() {
              local label="$1"
              shift

              echo "Creating index: $label"
              set +e
              output=$(gcloud firestore indexes composite create \
                --project=buyqk-rider \
                --database='(default)' \
                --query-scope=collection \
                --async \
                --quiet \
                "$@" 2>&1)
              code=$?
              set -e
              echo "$output"

              if [ "$code" -eq 0 ]; then
                return 0
              fi

              if echo "$output" | grep -Eqi 'already exists|ALREADY_EXISTS'; then
                echo "Index already exists; continuing."
                return 0
              fi

              return "$code"
            }

            create_index "stores: isApproved, status, isOpen" \
              --collection-group=stores \
              --field-config=field-path=isApproved,order=ascending \
              --field-config=field-path=status,order=ascending \
              --field-config=field-path=isOpen,order=ascending

            create_index "orders: customerId, createdAt" \
              --collection-group=orders \
              --field-config=field-path=customerId,order=ascending \
              --field-config=field-path=createdAt,order=descending

            create_index "orders: storeId, createdAt" \
              --collection-group=orders \
              --field-config=field-path=storeId,order=ascending \
              --field-config=field-path=createdAt,order=descending

            create_index "orders: storeId, status, completedAt" \
              --collection-group=orders \
              --field-config=field-path=storeId,order=ascending \
              --field-config=field-path=status,order=ascending \
              --field-config=field-path=completedAt,order=descending

            create_index "orders: status, readyAt" \
              --collection-group=orders \
              --field-config=field-path=status,order=ascending \
              --field-config=field-path=readyAt,order=descending

            create_index "orders: assignedRiderId, updatedAt" \
              --collection-group=orders \
              --field-config=field-path=assignedRiderId,order=ascending \
              --field-config=field-path=updatedAt,order=descending

            create_index "orders: assignedRiderId, status" \
              --collection-group=orders \
              --field-config=field-path=assignedRiderId,order=ascending \
              --field-config=field-path=status,order=ascending

            create_index "orders: assignedRiderId, status, completedAt" \
              --collection-group=orders \
              --field-config=field-path=assignedRiderId,order=ascending \
              --field-config=field-path=status,order=ascending \
              --field-config=field-path=completedAt,order=ascending

            echo "Current composite indexes:"
            gcloud firestore indexes composite list \
              --project=buyqk-rider \
              --database='(default)' \
              --format='table(name.basename(),collectionGroup,queryScope,state)'
          ) 2>&1 | tee firestore-deploy.log

          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Record deployment result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          EXIT_CODE: ${{ steps.deploy.outputs.exit_code }}
        shell: bash
        run: |
          {
            printf 'outcome=%s\nsource_sha=%s\nexit_code=%s\n\n' "$DEPLOY_OUTCOME" "$SOURCE_SHA" "$EXIT_CODE"
            if [ -f firestore-deploy.log ]; then
              tail -n 80 firestore-deploy.log \
                | sed -E 's/(Help Token:).*/\1 [redacted]/' \
                | sed -E 's#https://[^ ]+#https://[redacted]#g'
            fi
          } > firestore-index-deploy-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore-index-deploy-status.txt
          git commit -m "Record Firestore index deployment result" || exit 0
          git push

      - name: Fail workflow when deployment fails
        if: steps.deploy.outcome != 'success'
        run: exit 1
