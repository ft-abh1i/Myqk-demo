name: CI Authorization Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: buyqk-rider

      - name: Patch Firestore rules and tests
        shell: python
        run: |
          from pathlib import Path

          rules_path = Path('firestore.rules')
          rules = rules_path.read_text()
          replacements = [
            (
              """    function publicStore(storeId) {
      return exists(/databases/$(database)/documents/stores/$(storeId))
        && get(/databases/$(database)/documents/stores/$(storeId)).data.isApproved == true
        && get(/databases/$(database)/documents/stores/$(storeId)).data.status == 'active'
        && get(/databases/$(database)/documents/stores/$(storeId)).data.isOpen == true;
    }""",
              """    function publicStoreData(data) {
      return data.isApproved == true
        && data.status == 'active'
        && data.isOpen == true;
    }

    function publicStore(storeId) {
      return exists(/databases/$(database)/documents/stores/$(storeId))
        && publicStoreData(
          get(/databases/$(database)/documents/stores/$(storeId)).data
        );
    }"""
            ),
            ("        && request.resource.data.accountStatus == 'pending'", "        && request.resource.data.accountStatus == 'active'"),
            (
              """        ).data.status == 'pending_approval';""",
              """        ).data.status == 'active'
        && getAfter(
          /databases/$(database)/documents/stores/$(request.resource.data.storeId)
        ).data.isApproved == true;"""
            ),
            (
              """        && request.resource.data.isApproved == false
        && request.resource.data.status == 'pending_approval'""",
              """        && request.resource.data.isApproved == true
        && request.resource.data.status == 'active'"""
            ),
            ("        || publicStore(storeId);", "        || publicStoreData(resource.data);"),
          ]
          for old, new in replacements:
            if old not in rules:
              raise SystemExit(f'Missing expected rule block: {old!r}')
            rules = rules.replace(old, new, 1)

          rider_anchor = """      allow update: if isOwner(riderId)
        && request.resource.data.uid == resource.data.uid
        && request.resource.data.onboardingComplete == resource.data.onboardingComplete
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly([
          'fullName', 'email', 'photoURL', 'phone', 'city',"""
          rider_activation = """      allow update: if isOwner(riderId)
        && request.resource.data.uid == resource.data.uid
        && request.resource.data.onboardingComplete == resource.data.onboardingComplete
        && request.resource.data.isApproved == true
        && request.resource.data.accountStatus == 'active'
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly([
          'isApproved', 'accountStatus', 'updatedAt'
        ]);

"""
          if rider_activation not in rules:
            if rider_anchor not in rules:
              raise SystemExit('Missing rider update insertion point.')
            rules = rules.replace(rider_anchor, rider_activation + rider_anchor, 1)
          rules_path.write_text(rules)

          tests_path = Path('tests/firestore-rules.integration.mjs')
          tests = tests_path.read_text()
          tests = tests.replace(
            "  collection,\n  doc,\n  runTransaction,",
            "  collection,\n  doc,\n  getDocs,\n  query,\n  runTransaction,"
          )
          tests = tests.replace(
            "  updateDoc,\n  writeBatch",
            "  updateDoc,\n  where,\n  writeBatch"
          )
          marker = "test('merchant onboarding requires the pending store and profile to be created together'"
          start = tests.index(marker)
          prefix, onboarding = tests[:start], tests[start:]
          onboarding = onboarding.replace(marker, "test('merchant onboarding creates an active store and profile together'", 1)
          onboarding = onboarding.replace(
            "    isApproved: false,\n    status: 'pending_approval',",
            "    isApproved: true,\n    status: 'active',",
            1
          )
          onboarding = onboarding.replace("    accountStatus: 'pending'", "    accountStatus: 'active'", 1)
          tests = prefix + onboarding

          public_test = """test('public homepage query can list active open stores', async () => {
  const publicDb = rulesEnvironment.unauthenticatedContext().firestore();
  const storesQuery = query(
    collection(publicDb, 'stores'),
    where('isApproved', '==', true),
    where('status', '==', 'active'),
    where('isOpen', '==', true)
  );
  const snapshot = await assertSucceeds(getDocs(storesQuery));
  assert.equal(snapshot.size, 1);
});

"""
          insert_at = "test('customer order validation accepts the real bill and rejects a tampered total', async () => {"
          if public_test not in tests:
            tests = tests.replace(insert_at, public_test + insert_at, 1)
          tests_path.write_text(tests)

      - name: Validate changes
        run: |
          npm ci
          npm test
          npm run build
          npx --yes firebase-tools@15.25.1 emulators:exec --only firestore --project demo-buyqk-rules-tests "npm run test:rules"

      - name: Commit rules and restore standard CI
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: 21
                - run: npm ci
                - run: npm test
                - run: npm run build
                - name: Test Firestore rules
                  run: npx --yes firebase-tools@15.25.1 emulators:exec --only firestore --project demo-buyqk-rules-tests "npm run test:rules"
          EOF
          rm -f .github/workflows/patch-auto-authorization-rules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules tests/firestore-rules.integration.mjs .github/workflows/ci.yml .github/workflows/patch-auto-authorization-rules.yml
          git commit -m "Auto-authorize merchants and riders in Firestore rules"
          git push

      - name: Deploy Firestore rules
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx --yes firebase-tools@15.25.1 deploy --only firestore:rules --project buyqk-rider --non-interactive 2>&1 | tee deploy-rules.log
          cli_status=${PIPESTATUS[0]}
          set -e
          if [ "$cli_status" -eq 0 ]; then
            echo "method=firebase-cli" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Firebase CLI failed; trying Firebase Rules REST API." | tee -a deploy-rules.log
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python <<'PY' 2>&1 | tee -a deploy-rules.log
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          project = 'buyqk-rider'
          token = os.environ['ACCESS_TOKEN']

          def api(url, method, body):
              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode(),
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError(error.read().decode()) from error

          ruleset = api(
              f'https://firebaserules.googleapis.com/v1/projects/{project}/rulesets',
              'POST',
              {'source': {'files': [{'name': 'firestore.rules', 'content': Path('firestore.rules').read_text()}]}},
          )
          api(
              f'https://firebaserules.googleapis.com/v1/projects/{project}/releases/cloud.firestore?updateMask=rulesetName',
              'PATCH',
              {'name': f'projects/{project}/releases/cloud.firestore', 'rulesetName': ruleset['name']},
          )
          print('Rules deployed with REST API.')
          PY
          rest_status=${PIPESTATUS[0]}
          if [ "$rest_status" -eq 0 ]; then
            echo "method=rest-api" >> "$GITHUB_OUTPUT"
          fi
          exit "$rest_status"

      - name: Migrate existing marketplace records
        id: migrate
        continue-on-error: true
        shell: bash
        run: |
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python <<'PY' 2>&1 | tee migrate-records.log
          import datetime
          import json
          import os
          import urllib.parse
          import urllib.request

          project = 'buyqk-rider'
          root = f'https://firestore.googleapis.com/v1/projects/{project}/databases/(default)/documents'
          token = os.environ['ACCESS_TOKEN']

          def api(url, method='GET', body=None):
              payload = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(
                  url,
                  data=payload,
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def all_docs(collection):
              page_token = ''
              while True:
                  params = {'pageSize': 300}
                  if page_token:
                      params['pageToken'] = page_token
                  response = api(f"{root}/{collection}?{urllib.parse.urlencode(params)}")
                  yield from response.get('documents', [])
                  page_token = response.get('nextPageToken', '')
                  if not page_token:
                      break

          def scalar(field):
              return next(iter(field.values()), None) if field else None

          def patch(document, fields):
              masks = [('updateMask.fieldPaths', field) for field in fields]
              url = f"https://firestore.googleapis.com/v1/{document['name']}?{urllib.parse.urlencode(masks)}"
              api(url, 'PATCH', {'fields': fields})

          now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z')
          changed = {'stores': 0, 'merchants': 0, 'riders': 0}
          for document in all_docs('stores'):
              fields = document.get('fields', {})
              if scalar(fields.get('isApproved')) is not True or scalar(fields.get('status')) != 'active':
                  patch(document, {
                      'isApproved': {'booleanValue': True},
                      'status': {'stringValue': 'active'},
                      'updatedAt': {'timestampValue': now},
                  })
                  changed['stores'] += 1
          for document in all_docs('merchants'):
              if scalar(document.get('fields', {}).get('accountStatus')) != 'active':
                  patch(document, {
                      'accountStatus': {'stringValue': 'active'},
                      'updatedAt': {'timestampValue': now},
                  })
                  changed['merchants'] += 1
          for document in all_docs('riders'):
              fields = document.get('fields', {})
              if scalar(fields.get('isApproved')) is not True or scalar(fields.get('accountStatus')) != 'active':
                  patch(document, {
                      'isApproved': {'booleanValue': True},
                      'accountStatus': {'stringValue': 'active'},
                      'updatedAt': {'timestampValue': now},
                  })
                  changed['riders'] += 1
          print(json.dumps(changed, sort_keys=True))
          PY

      - name: Record deployment and migration result
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_METHOD: ${{ steps.deploy.outputs.method }}
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
        run: |
          git pull --rebase
          {
            printf 'deploy_outcome=%s\n' "$DEPLOY_OUTCOME"
            printf 'deploy_method=%s\n' "$DEPLOY_METHOD"
            printf 'migration_outcome=%s\n\n' "$MIGRATE_OUTCOME"
            echo '--- deploy log ---'
            tail -n 30 deploy-rules.log 2>/dev/null || true
            echo
            echo '--- migration log ---'
            tail -n 20 migrate-records.log 2>/dev/null || true
          } > auto-authorization-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-authorization-status.txt
          git commit -m "Record marketplace authorization result" || exit 0
          git push
