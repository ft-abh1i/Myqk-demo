name: Run marketplace auto-authorization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: marketplace-auto-authorization
  cancel-in-progress: false

jobs:
  authorize:
    if: github.head_ref == 'agent/auto-authorize-marketplace'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Check whether migration is pending
        id: guard
        shell: bash
        run: |
          if [ -f scripts/auto_authorize_marketplace.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Patch Firestore rules and tests
        if: steps.guard.outputs.run == 'true'
        run: python scripts/auto_authorize_marketplace.py patch

      - name: Validate app and Firestore rules
        if: steps.guard.outputs.run == 'true'
        run: |
          npm ci
          npm test
          npm run build
          npx --yes firebase-tools@15.25.1 emulators:exec --only firestore --project demo-buyqk-rules-tests "npm run test:rules"

      - name: Authenticate to Google Cloud
        if: steps.guard.outputs.run == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        if: steps.guard.outputs.run == 'true'
        with:
          project_id: buyqk-rider

      - name: Deploy Firestore rules
        if: steps.guard.outputs.run == 'true'
        run: npx --yes firebase-tools@15.25.1 deploy --only firestore:rules --project buyqk-rider --non-interactive

      - name: Activate existing marketplace records
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python scripts/auto_authorize_marketplace.py migrate | tee auto-authorization-status.txt

      - name: Commit verified rules and migration result
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          rm -f scripts/auto_authorize_marketplace.py
          rm -f .github/workflows/auto-authorize-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules tests/firestore-rules.integration.mjs auto-authorization-status.txt scripts/auto_authorize_marketplace.py .github/workflows/auto-authorize-pr.yml
          git commit -m "Auto-authorize merchants and riders"
          git push origin HEAD:${{ github.head_ref }}
